[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-splines"
version = "0.1.0"
description = "Parametrises an airfoil as a smooth spline given input coordinate points"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10"
]

[tool.setuptools.packages.find]
where = ["src"]
